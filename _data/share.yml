# Pagine HTML condivise, servite cosi' come sono da /share/<file>.
#
# Per aggiungerne una:
#   1. copia il file .html autonomo (con <!doctype html>, <head>, <body>) in share/
#   2. aggiungi qui sotto una voce con almeno file e title
#
# Campi:
#   file         nome del file dentro share/ (obbligatorio)
#   title        titolo mostrato nella lista (obbligatorio)
#   description  una riga di spiegazione
#   date         AAAA-MM-GG (obbligatorio: la lista e' ordinata per data)
#   tags         lista di etichette brevi
#   listed       false = non compare nella pagina Share; raggiungibile solo da chi ha il link
